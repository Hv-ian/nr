    <!--
      Decap CMS, authenticated through DecapBridge. It runs entirely in the
      browser: editors sign in with their own email and password (or Google or
      Microsoft), and saving a post commits it to this repository, which starts
      the GitHub Actions build that republishes the site.

      Pinned deliberately. DecapBridge's PKCE flow needs v3.8.3 or newer, and an
      unpinned CDN URL would let a future release change the admin panel without
      anything in this repository changing.
    -->
    <script src="https://unpkg.com/decap-cms@3.16.2/dist/decap-cms.js"></script>
  </body>
