# Decap CMS configuration for relopartner.org
#
# Authentication and user management run through DecapBridge, so editors sign
# in with their own email and password (or Google or Microsoft) rather than a
# GitHub account. Saving an entry is a commit to this repository; the commit
# triggers the GitHub Actions build, which republishes the site. No server is
# involved anywhere in that chain, which is what lets the admin panel live on
# GitHub Pages.
#
# Editors are invited from the DecapBridge dashboard. Removing someone there
# revokes their access immediately.

backend:
  name: git-gateway
  repo: Hv-ian/nr
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/8b2d9a3d-b41c-475e-9863-e150c1cc263a/pkce
  auth_token_endpoint: /sites/8b2d9a3d-b41c-475e-9863-e150c1cc263a/token
  gateway_url: https://gateway.decapbridge.com

  # Commits are attributed to the repository owner's account, because "Hide
  # commit author" is enabled in DecapBridge. Naming the editor in the message
  # keeps a record of who published what without adding them as contributors.
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Maps the fields DecapBridge returns about the signed-in editor.
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

site_url: https://relopartner.org
display_url: https://relopartner.org
logo_url: https://relopartner.org/images/ararat.avif

# Uploaded images land in the site's public folder and are served from /images/blog/.
media_folder: public/images/blog
public_folder: /images/blog

# Every post exists in all three languages. Decap shows one tab per locale and
# will not let a required field stay empty in any of them.
i18n:
  structure: multiple_folders
  locales: [en, ru, hy]
  default_locale: en

collections:
  - name: blog
    label: Blog posts
    label_singular: Blog post
    description: >-
      Articles for relopartner.org/blog. Fill in the English, Russian and
      Armenian tabs, then publish. The site rebuilds automatically and the
      article appears in a couple of minutes.
    folder: content/blog
    create: true
    slug: '{{slug}}'
    preview_path: 'blog/{{slug}}'
    i18n: true
    summary: '{{title}}'
    sortable_fields: [date, title]
    view_filters:
      - label: Drafts
        field: draft
        pattern: true
    fields:
      - name: title
        label: Title
        widget: string
        i18n: true
        hint: The article headline, shown on the card and as the page's H1.

      - name: description
        label: Short description
        widget: text
        i18n: true
        hint: >-
          Two sentences at most. Used on the blog card, under the headline, and
          as the description Google shows in search results.

      - name: image
        label: Cover image
        widget: image
        i18n: duplicate
        choose_url: false
        hint: >-
          Landscape photo, at least 1600 pixels wide or it will look soft on
          large screens. The same image is used for all three languages.

      - name: imageFocus
        label: Image crop
        widget: select
        i18n: duplicate
        default: center
        options:
          - { label: 'Keep the top of the photo', value: top }
          - { label: 'Keep the middle of the photo', value: center }
          - { label: 'Keep the bottom of the photo', value: bottom }
        hint: >-
          Cover images are cropped to fit the cards. Choose "top" when the
          subject sits near the top of the photo, such as a mountain peak or a
          flag, so it is not cut off.

      - name: category
        label: Category
        widget: select
        i18n: duplicate
        options:
          - { label: 'Relocation', value: relocation }
          - { label: 'Residence & Citizenship', value: residence }
          - { label: 'Business in Armenia', value: business }
          - { label: 'Tax & Accounting', value: tax }
          - { label: 'Living in Armenia', value: living }
          - { label: 'Banking & Finance', value: banking }

      - name: date
        label: Publication date
        widget: datetime
        i18n: duplicate
        date_format: 'YYYY-MM-DD'
        time_format: false
        picker_utc: true

      - name: featured
        label: Feature at the top of the blog
        widget: boolean
        i18n: duplicate
        default: false
        required: false
        hint: >-
          The featured article fills the large panel above the grid. If more
          than one is flagged, the newest wins.

      - name: draft
        label: Draft
        widget: boolean
        i18n: duplicate
        default: false
        required: false
        hint: Drafts are saved to the repository but never published to the site.

      - name: body
        label: Article
        widget: markdown
        i18n: true
        hint: >-
          Use "Heading 2" for section titles; those become the table of contents
          on the right of the article. Numbered lists render as numbered steps
          and bullet lists as ticks. A quote block becomes the highlighted note.
